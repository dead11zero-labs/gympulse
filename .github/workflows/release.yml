name: Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - app/build.gradle.kts
      - app/proguard-rules.pro

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.GYMPULSE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Without the secret the release build falls back to the debug key (installable, but not for the Play Store).
      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "GYMPULSE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          GYMPULSE_KEYSTORE_PASSWORD: ${{ secrets.GYMPULSE_KEYSTORE_PASSWORD }}
          GYMPULSE_KEY_ALIAS: ${{ secrets.GYMPULSE_KEY_ALIAS }}
          GYMPULSE_KEY_PASSWORD: ${{ secrets.GYMPULSE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name APK
        id: apk
        run: |
          signing=$([ -n "$KEYSTORE_BASE64" ] && echo release || echo debugkey)
          name="gympulse-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}-${signing}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gympulse-release-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" --title "GymPulse $GITHUB_REF_NAME" --generate-notes --prerelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            **/build/reports/
            app/build/outputs/mapping/
          if-no-files-found: ignore
