name: Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - app/build.gradle.kts
      - app/proguard-rules.pro
      - wear/build.gradle.kts
      - wear/proguard-rules.pro
      - build-logic/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.GYMPULSE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Without the secret the release build falls back to the debug key (installable, but not for the Play Store).
      # Phone and watch APK must share the same key (same applicationId), otherwise the Wearable Data Layer refuses to connect.
      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "GYMPULSE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          GYMPULSE_KEYSTORE_PASSWORD: ${{ secrets.GYMPULSE_KEYSTORE_PASSWORD }}
          GYMPULSE_KEY_ALIAS: ${{ secrets.GYMPULSE_KEY_ALIAS }}
          GYMPULSE_KEY_PASSWORD: ${{ secrets.GYMPULSE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :wear:assembleRelease --stacktrace

      - name: Name APKs
        id: apk
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          signing=$([ -n "$KEYSTORE_BASE64" ] && echo release || echo debugkey)
          ref="${REF_NAME//\//-}"
          phone="gympulse-${ref}-${GITHUB_RUN_NUMBER}-${signing}.apk"
          wear="gympulse-wear-${ref}-${GITHUB_RUN_NUMBER}-${signing}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$phone"
          cp wear/build/outputs/apk/release/wear-release.apk "$wear"
          echo "phone=$phone" >> "$GITHUB_OUTPUT"
          echo "wear=$wear" >> "$GITHUB_OUTPUT"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: gympulse-release-apk
          path: |
            ${{ steps.apk.outputs.phone }}
            ${{ steps.apk.outputs.wear }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PHONE_APK: ${{ steps.apk.outputs.phone }}
          WEAR_APK: ${{ steps.apk.outputs.wear }}
        run: gh release create "$GITHUB_REF_NAME" "$PHONE_APK" "$WEAR_APK" --title "GymPulse $GITHUB_REF_NAME" --generate-notes --prerelease

      # Rolling prerelease with the plain APKs, so they can be downloaded without unzipping (e.g. on a phone).
      - name: Publish latest build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PHONE_APK: ${{ steps.apk.outputs.phone }}
          WEAR_APK: ${{ steps.apk.outputs.wear }}
        run: |
          gh release delete latest-main --cleanup-tag --yes || true
          gh release create latest-main "$PHONE_APK" "$WEAR_APK" --target "$GITHUB_SHA" --prerelease \
            --title "GymPulse latest build" \
            --notes "Automatic build of main (${GITHUB_SHA::7}), run #${GITHUB_RUN_NUMBER}. APKs: phone app (gympulse-*.apk) and Wear OS app (gympulse-wear-*.apk)."

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            **/build/reports/
            app/build/outputs/mapping/
            wear/build/outputs/mapping/
          if-no-files-found: ignore
